name: rinha-2026

# Compose oficial. Replicando o setup do lothyriel/rinha_2026 (Rust+axum,
# passa no Mac Mini Late 2014):
#   - tokio current_thread (single-thread runtime, sem overhead multi_thread)
#   - UDS via tmpfs volume mode=0777 + APIs setam 0o666 no socket
#   - HAProxy com http-reuse always proxying via unix@
#   - CPU split 0.3 + 0.3 + 0.4 (LB precisa de mais CPU)

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api1.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api2.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"
    networks:
      - rinha

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"

networks:
  rinha:
    driver: bridge
