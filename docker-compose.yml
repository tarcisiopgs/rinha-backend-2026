name: rinha-2026

# Compose oficial de submissão. CPU split inspirado em lothyriel/rinha_2026
# (Rust + axum que passou no Mac Mini): LB com 0.4 CPU pra drainar a accept
# queue rápido sob k6, APIs com 0.3 CPU cada. APIs com 150 MB cada + HAProxy
# 50 MB = 350 MB. 0.3+0.3+0.4 = 1.0 CPU. ulimits nofile=65535 evita
# exhaustion no ramp.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
