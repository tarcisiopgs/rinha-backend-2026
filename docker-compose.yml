name: rinha-2026

services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026:latest
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - ./data:/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "170MB"
    networks:
      - rinha

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026:latest
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - ./data:/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "170MB"
    networks:
      - rinha

  lb:
    image: rinha-2026:latest
    entrypoint: ["/usr/local/bin/lb"]
    environment:
      LB_LISTEN: 0.0.0.0:9999
      LB_UPSTREAMS: tcp:api1:9000,tcp:api2:9000
      RUST_LOG: warn
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "10MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
