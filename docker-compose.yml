name: rinha-2026

# Compose oficial de submissão. Setup inspirado no top-1 (thiagorigonatti):
#   - HAProxy como LB (battle-tested, http-reuse always)
#   - UDS via named volume (não tmpfs) entre LB ↔ APIs
#   - security_opt: seccomp=unconfined nas APIs habilita io_uring no Docker
#     (perfil padrão do Docker bloqueia io_uring_setup via seccomp)
#
# Total: 1 CPU, 350 MB. 2 APIs com 0.40 CPU / 150 MB cada + HAProxy com
# 0.20 CPU / 50 MB. ulimits nofile=65535 evita exhaustion sob k6.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api1.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api2.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"
    networks:
      - rinha

volumes:
  sockets:

networks:
  rinha:
    driver: bridge
