name: rinha-2026

# Compose oficial de submissão — referencia imagem pré-construída em ghcr.io
# (linux/amd64, RUSTFLAGS=-C target-cpu=haswell -C target-feature=+avx2,+fma,
# dataset embutido em /data/references.bin).
#
# Total: 1 CPU, 350 MB. 2 APIs com 0.40 CPU / 160 MB cada + LB com 0.20 CPU
# / 30 MB. ulimits nofile=65535 evita exhaustion de fds quando o k6 abre 250
# VUs concorrentes durante o ramp.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
      MONOIO_DRIVER: legacy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
      MONOIO_DRIVER: legacy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha

  lb:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/lb"]
    environment:
      LB_LISTEN: 0.0.0.0:9999
      LB_UPSTREAMS: tcp:api1:9000,tcp:api2:9000
      RUST_LOG: warn
      MONOIO_DRIVER: legacy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
