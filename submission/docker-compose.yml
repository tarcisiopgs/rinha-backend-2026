name: rinha-2026

# Compose oficial de submissão. APIs (Rust + monoio + IVF + AVX2 i16) servem
# atrás de um nginx fazendo round-robin TCP. nginx é mais robusto que o LB
# Rust caseiro sob carga de 250 VUs concorrentes do k6 (oficial).
#
# Total: 1 CPU, 350 MB. 2 APIs com 0.40 CPU / 160 MB cada + LB nginx com
# 0.20 CPU / 30 MB.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
      MONOIO_DRIVER: legacy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
      MONOIO_DRIVER: legacy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha

  lb:
    image: nginx:1.27-alpine
    platform: linux/amd64
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
