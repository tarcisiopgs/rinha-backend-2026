name: rinha-2026

# Compose oficial. Setup convergindo no que lothyriel/rinha_2026 (Rust+axum)
# fez pra passar no Mac Mini Late 2014:
#   - UDS via tmpfs volume (mode=0777) entre LB ↔ APIs (sem TCP overhead)
#   - healthcheck nos APIs com start_period=20s pra prefault mmap completo
#     antes do bot iniciar o bench
#   - CPU split 0.3 + 0.3 + 0.4 (LB precisa de mais CPU pra drain accept queue)
#
# Total: 1 CPU, 350 MB. tokio UDS bind funciona em todos os runners (monoio
# tinha ENOTSUP no Mac Mini, por isso voltamos UDS agora que estamos em tokio).

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api1.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        ["CMD-SHELL", "test -S /sockets/api1.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: unix:/sockets/api2.sock
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        ["CMD-SHELL", "test -S /sockets/api2.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"
    networks:
      - rinha

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"

networks:
  rinha:
    driver: bridge
