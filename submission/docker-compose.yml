name: rinha-2026

# Compose oficial. Setup convergindo no que lothyriel/rinha_2026 fez pra
# passar no Mac Mini Late 2014, exceto que voltamos pra TCP intra-bridge:
# UDS sobre tmpfs falha no bench runner (api exit 1 no bind, mesmo bug que
# vimos com monoio antes — kernel/seccomp do Docker no Mac Mini bloqueia).
#
# Total: 1 CPU, 350 MB. CPU split 0.3 API + 0.3 API + 0.4 LB.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "50MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
