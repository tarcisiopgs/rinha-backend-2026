name: rinha-2026

# Compose oficial de submissão. Setup inspirado no top-1 (thiagorigonatti):
#   - HAProxy 3.3 como LB (battle-tested, http-reuse always)
#   - security_opt: seccomp=unconfined nas APIs habilita io_uring no Docker
#     (perfil padrão do Docker bloqueia io_uring_setup)
#
# Comunicação api↔lb via TCP intra-bridge — UDS sobre named volume falhou no
# bench runner (health check timeout, monoio bind UDS retorna ENOTSUP mesmo
# com seccomp liberado).
#
# Total: 1 CPU, 350 MB. 2 APIs com 0.40 CPU / 150 MB cada + HAProxy com
# 0.20 CPU / 50 MB. ulimits nofile=65535 evita exhaustion sob k6.

services:
  api1:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/tarcisiopgs/rinha-backend-2026:latest
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/usr/local/bin/api"]
    environment:
      API_LISTEN: tcp:0.0.0.0:9000
      DATASET_PATH: /data/references.bin
      RUST_LOG: warn
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - rinha

  lb:
    image: haproxy:3.3
    platform: linux/amd64
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
